<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #7fffd4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #f4f4f4;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      padding: 32px 24px;
      position: relative;
    }
    .header {
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 24px;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .nav a {
      color: #0077cc;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav a:hover {
      color: #005fa3;
      text-decoration: underline;
    }
    .profile-pic {
      display: block;
      margin: 0 auto 16px auto;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      background: #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .welcome {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .details {
      margin: 0 auto 24px auto;
      max-width: 350px;
      background: #fff;
      border-radius: 8px;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .details p {
      margin: 10px 0;
      font-size: 1rem;
    }
    .details span {
      font-weight: bold;
      color: #222;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
    }
    .actions a {
      color: #0077cc;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.2s;
    }
    .actions a:hover {
      color: #d32f2f;
      text-decoration: underline;
    }
    @media (max-width: 650px) {
      .container {
        padding: 16px 4px;
      }
      .details {
        padding: 12px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="{{ url_for('homepage') }}">Home</a>
      <a href="{{ url_for('logout') }}" style="float:right;">Logout</a>
    </div>
    <div class="header">Profile</div>
    <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Profile Picture" class="profile-pic">
    <div class="welcome"><p>Welcome, {{ student.username }} !</p></div>
    <div class="details">
      <p><strong>Username : </strong>{{student.username}}</p>
      <p><strong>Email : </strong>{{student.email}}</p>
      <p><strong>Password : </strong>{{student.password}}</p>
      <p><strong>Year : </strong>{{student.year}}</p>
    </div>
    <div class="actions">
      <a href="#">Edit Profile</a>
      <a href="#">Delete Profile</a>
    </div>
  </div>
</body>
</html>
