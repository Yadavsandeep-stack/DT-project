<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Selector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style1.css') }}">
</head>
<body>
  <!-- Navbar/Header -->
  <header>
    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/5087/5087579.png" alt="Study Selector Logo">
    </div>
    <nav class="navigation">
      <a href="{{ url_for('homepage') }}">Home</a>
      <a href="{{ url_for('about') }}">About</a>
      <a href="{{ url_for('study_form') }}">Study</a>
      <a href="{{ url_for('contact') }}">Contact</a>
    </nav>
  </header>

  <!-- Study Selector Title and Search -->
  <div class="header">
    <span class="logo-text">study selector</span>
    <input class="search-bar" type="text" placeholder="search subject, branch and educators">
  </div>

  <!-- Features Row -->
  <div class="features-row">
    <div class="feature-card feature-quiz">
      <span>💡</span>
      quiz
    </div>
    <div class="feature-card feature-notes">
      <span>📖</span>
      notes
    </div>
    <div class="feature-card feature-tests">
      <span>🅰️+</span>
      tests
    </div>
    <div class="feature-card feature-1to1">
      <span>🐰</span>
      one to one class
    </div>
  </div>

  <!-- Educator Section -->
  <div class="explore-title">Explore educators</div>
  <div class="educator-row">
    <div class="educator-card">
      <div class="educator-title">Mechanical</div>
      <div class="educator-list">
        &gt; thermodynamics<br>
        &gt; applied mechanics<br>
        &gt; dynamics
      </div>
      <div class="educator-avatar">👩🏫</div>
      <button class="educator-name">Neha Jain</button>
    </div>
    <div class="educator-card empty"></div>
    <div class="educator-card empty"></div>
  </div>
</body>
</html>
